services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rorigenes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin123
    ports:
      - "5434:5432"
    volumes:
      - origenes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rorigenes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  origenes-data:
